	fromdate =document.getElementById("Fromdatepicker").value;
	todate =document.getElementById("Todatepicker").value;
	msgPrefix = "Please fill in valid: \n";
	msgElement = "";

	if (nea_location == "") 
		msgElement = msgElement + "NEA Location \n";
	if (scno == "") 
		msgElement = msgElement + "SCNo \n";
	if (consumerid == "") 
		msgElement = msgElement + "Consumer Id \n";
	if (fromdate == "") 
		msgElement = msgElement + "From Date \n";
	if (todate == "") 
		msgElement = msgElement + "To Date \n";
		if (consumerid != "") 
		{
			if(isNaN(consumerid))
				msgElement = msgElement + " ConsumerId must be numeric"
		}

	
	
	if(msgElement != "")
		alert(msgPrefix + msgElement);
	else
	{
		actionForm.submit();
	}		
}
