[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mukezhz/sajilo"

[workspace.dependencies]
sajilo-core = { path = "crates/sajilo-core" }
sajilo-api = { path = "crates/sajilo-api" }
sajilo-providers = { path = "crates/sajilo-providers" }

chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
