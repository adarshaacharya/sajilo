[package]
name = "sajilo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# Tauri wants the app as a library so the mobile entry points can share it.
name = "sajilo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sajilo-api.workspace = true
sajilo-core.workspace = true
sajilo-providers.workspace = true
chrono.workspace = true
futures-util = "0.3"
# The random usage id, and nothing else. `v4` only: no node id, no MAC address,
# no timestamp — a v1 uuid would embed both and stop being anonymous.
uuid = { version = "1", default-features = false, features = ["v4", "std"] }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
# 2.12 at least: it brings tray-icon 0.25.1, without which a left click on the
# macOS 27 tray opens the menu instead of the popover.
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
# Rasterises the tray flag (see resvg below).
tiny-skia = "0.11"
# Renders the bundled Nepal flag SVG for Windows' tray icon. Pinned to 0.44 —
# the last resvg release on tiny-skia 0.11, matching the pin above rather than
# the 0.12 that newer resvg wants. `default-features = false` drops text/font
# support (`usvg`'s "text" feature and friends): the flag has no text in it.
resvg = { version = "0.44", default-features = false }
# Keeper photos: decode what a phone or a screenshot produces, apply EXIF
# orientation, scale, and re-encode as JPEG. Codecs limited to those formats.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
url = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSWindow"] }
# Native NSVisualEffectView — same class of material Swift uses for `.regularMaterial`.
window-vibrancy = "0.6"

# Focus asks the desktop session how long input has been idle. Already in the
# Linux build through the notification plugin, so this adds no new crates.
[target."cfg(target_os = \"linux\")".dependencies]
zbus = "5"
# Asks X11 whether a mouse button is down, to tell a click away from the mouse
# merely moving focus. Already in the build through Tauri.
gdk = "0.18"
# The StatusNotifierItem tray (ksni) rather than libappindicator: it gets a
# left click on the icon, where libappindicator only ever opens the menu.
# Tauri enables the libappindicator backend; with both on, tray-icon uses
# ksni. Same version as Tauri's, so this only adds the feature.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
